name: AI Catalog metadata

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [incremental, full]
        default: full
      write:
        description: Write only the two Catalog metafields (also requires repository enable variable)
        type: boolean
        default: false
      max_writes:
        description: 'Maximum products to write (1 to 500; full backfill without product IDs allows 1000)'
        default: '5'
      max_products:
        description: Maximum products to inspect in this slice (1 to 25000)
        default: '250'
      max_duration_seconds:
        description: Runtime budget (1 to 7200; use 2700 for manual backfill or 7200 for a complete read-only scan)
        default: '1200'
      product_ids:
        description: Optional comma-separated product IDs for a canary (up to 10)
        default: ''
  schedule:
    - cron: '7,22,37,52 * * * *'
    - cron: '41 5 * * *'

permissions:
  contents: read

concurrency:
  group: ai-catalog-metadata
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.AI_CATALOG_SCHEDULE_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify isolated updater
        run: node --test tests/ai-catalog-*.test.js
      - name: Reconcile private Catalog metadata
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          AI_CATALOG_WRITES_ENABLED: ${{ vars.AI_CATALOG_WRITES_ENABLED }}
          RUN_EVENT: ${{ github.event_name }}
          RUN_SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_WRITE: ${{ inputs.write }}
          INPUT_MAX_WRITES: ${{ inputs.max_writes }}
          INPUT_MAX_PRODUCTS: ${{ inputs.max_products }}
          INPUT_MAX_DURATION_SECONDS: ${{ inputs.max_duration_seconds }}
          INPUT_PRODUCT_IDS: ${{ inputs.product_ids }}
        shell: bash
        run: |
          mode=incremental
          max_writes=100
          max_products=500
          max_duration_seconds=1200
          if [[ "$RUN_SCHEDULE" == '41 5 * * *' ]]; then mode=full; fi
          if [[ "$RUN_EVENT" == workflow_dispatch ]]; then
            mode="$INPUT_MODE"
            max_writes="$INPUT_MAX_WRITES"
            max_products="$INPUT_MAX_PRODUCTS"
            max_duration_seconds="$INPUT_MAX_DURATION_SECONDS"
          fi
          args=(--mode "$mode" --max-writes "$max_writes" --max-products "$max_products" --max-duration-seconds "$max_duration_seconds")
          if [[ "$RUN_EVENT" == workflow_dispatch && -n "$INPUT_PRODUCT_IDS" ]]; then
            args+=(--product-ids "$INPUT_PRODUCT_IDS")
          fi
          if [[ "$RUN_EVENT" == workflow_dispatch && "$INPUT_WRITE" == true ]] || [[ "$RUN_EVENT" == schedule && "$AI_CATALOG_WRITES_ENABLED" == true ]]; then
            args+=(--write)
          fi
          node scripts/sync-ai-catalog-metafields.js "${args[@]}"
