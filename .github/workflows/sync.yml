name: Sync Nivoda Diamonds
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

# A complete 660k-row feed currently needs approximately 100 minutes. Keep one
# writer at a time; timeout/error must never trigger stale cleanup.
concurrency:
  group: nivoda-supplier-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node scripts/sync-nivoda.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NIVODA_FTP_HOST: ${{ secrets.NIVODA_FTP_HOST }}
          NIVODA_FTP_USER: ${{ secrets.NIVODA_FTP_USER }}
          NIVODA_FTP_PASS: ${{ secrets.NIVODA_FTP_PASS }}
          NIVODA_FTP_PATH: ${{ secrets.NIVODA_FTP_PATH }}
          MARKUP_PERCENT: ${{ secrets.MARKUP_PERCENT }}
