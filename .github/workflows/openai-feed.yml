name: OpenAI Product Feed

on:
  schedule:
    # Every 6 hours, offset 3h from the Google Merchant feed
    - cron: '0 3/6 * * *'
  workflow_dispatch: # Manual trigger

permissions:
  contents: write # publish the feed artifact to the rolling `feeds` release

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install @supabase/supabase-js

      - name: Generate feed
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/generate-openai-feed.js

      - name: Publish to rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view feeds -R ${{ github.repository }} > /dev/null 2>&1 || \
            gh release create feeds -R ${{ github.repository }} --title "Product feeds" \
              --notes "Rolling product-feed artifacts, refreshed every 6 hours." --latest=false
          gh release upload feeds output/diyona-diamonds-openai.tsv.gz -R ${{ github.repository }} --clobber
