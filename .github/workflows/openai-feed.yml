name: OpenAI Product Feed

on:
  schedule:
    # Every 6 hours, offset 3h from the Google Merchant feed
    - cron: '0 3/6 * * *'
  workflow_dispatch: # Manual trigger

permissions:
  contents: write # publish the feed artifact to the rolling `feeds` release
  issues: write # alert issue, see docs/product-feeds.md

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install @supabase/supabase-js

      - name: Generate feed
        id: generate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/generate-openai-feed.js

      - name: Publish to rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view feeds -R ${{ github.repository }} > /dev/null 2>&1 || \
            gh release create feeds -R ${{ github.repository }} --title "Product feeds" \
              --notes "Rolling product-feed artifacts, refreshed every 6 hours." --latest=false
          gh release upload feeds output/diyona-diamonds-openai.tsv.gz -R ${{ github.repository }} --clobber

      # One open issue per bad stretch: a failed or cancelled run, or one that
      # published stale supplier data, opens or comments on it, and the next
      # healthy run closes it. Neither step can change the run's result.
      - name: Raise feed alert
        if: failure() || cancelled() || steps.generate.outputs.stale == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          JOB_STATUS: ${{ job.status }}
          FRESHNESS_NOTE: ${{ steps.generate.outputs.freshness_note }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUNBOOK_URL: ${{ github.server_url }}/${{ github.repository }}/blob/main/docs/product-feeds.md
        run: |
          case "$JOB_STATUS" in
            success) note="$FRESHNESS_NOTE" ;;
            cancelled) note="was cancelled, so the previously published feed is still live." ;;
            *) note="failed, so the previously published feed is still live. The run log has the error." ;;
          esac
          bash scripts/workflow-alert.sh raise 'OpenAI Product Feed needs attention' "$note"

      - name: Close feed alert after a healthy run
        if: success() && steps.generate.outputs.stale != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FRESHNESS_NOTE: ${{ steps.generate.outputs.freshness_note }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/workflow-alert.sh resolve 'OpenAI Product Feed needs attention' "$FRESHNESS_NOTE"
