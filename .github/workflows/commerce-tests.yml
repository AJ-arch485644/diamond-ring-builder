name: Commerce and inventory tests
on:
  pull_request:
    paths: ['api/**', 'lib/**', 'scripts/**', 'tests/**', 'image-audit/select-refresh.js', 'package*.json', '.github/workflows/commerce-tests.yml', '.github/workflows/sync.yml']
  push:
    paths: ['api/**', 'lib/**', 'scripts/**', 'tests/**', 'image-audit/select-refresh.js', 'package*.json', '.github/workflows/commerce-tests.yml', '.github/workflows/sync.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/*.test.js
