name: AI Catalog approved four-product canary

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-catalog-metadata
  cancel-in-progress: false

jobs:
  canary:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && vars.AI_CATALOG_WRITES_ENABLED != 'true' && vars.AI_CATALOG_SCHEDULE_ENABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify isolated updater and fixed canary guards
        run: npm run test:ai-catalog
      - name: Apply only the reviewed four-product canary
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          AI_CATALOG_WRITES_ENABLED: ${{ vars.AI_CATALOG_WRITES_ENABLED }}
          AI_CATALOG_SCHEDULE_ENABLED: ${{ vars.AI_CATALOG_SCHEDULE_ENABLED }}
        run: node scripts/sync-ai-catalog-metafields.js --approved-canary
